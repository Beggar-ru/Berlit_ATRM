# Blowdryer (Spotless) settings version.
gtnh.settings.blowdryerTag = 0.2.2

# Human-readable mod name, used for mcmod.info and the jar name.
modName = Berlit_ATRM

# Produced artifact: Berlit_ATRM-<version>.jar (the technical mod id stays berlimatrm).
customArchiveBaseName = Berlit_ATRM

# Case-sensitive identifier, used for mcmod.info and the mixin config name.
modId = berlimatrm

# Root package of the mod.
modGroup = ru.beggar.berlimatrm

useModGroupForPublishing = true
autoUpdateBuildScript = false

# This project is shipped as a source drop, not a git checkout: do not derive the
# version from a git tag. build.gradle.kts pins it instead.
gtnh.modules.gitVersion = false

minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

developmentEnvironmentUserName = Developer

# Plain Java 8 source: this mod does not need jabel, and the plugin then avoids the
# named-pipe agent that the file sandbox blocks (see tools/dev-env.ps1).
enableModernJavaSyntax = false
enableGenericInjection = true

# Generated class with the build version (see Tags.VERSION).
generateGradleTokenClass = ru.beggar.berlimatrm.Tags
gradleTokenVersion = VERSION
replaceGradleTokenInFile =

apiPackage =
accessTransformersFile =

# No mixins: the mod only uses the public Avaritia/MineTweaker APIs.
usesMixins = false
separateMixinSourceSet =
usesMixinDebug = false
mixinPlugin =
mixinsPackage =
coreModClass =
containsMixinsAndOrCoreModOnly = false
forceEnableMixins = false

usesShadowedDependencies = false
minimizeShadowedDependencies = true
relocateShadowedDependencies = true
includeWellKnownRepositories = true
excludeWellKnownRepositories =
usesMavenPublishing = false
modrinthProjectId =
modrinthRelations =
curseForgeProjectId =
curseForgeEnvironments = client,server
curseForgeRelations =

# Keep Spotless strict: the CI build runs spotlessJavaCheck.
disableSpotless = false
disableCheckstyle = false

org.gradle.configuration-cache = true
org.gradle.parallel = true
